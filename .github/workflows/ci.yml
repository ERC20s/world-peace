name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit and end-to-end tests for the validators, the build and the search script.
      - run: npm test

      # Pages, data/ against its JSON Schemas, page-vs-data, meta tags, and the
      # generated initiatives.html / sitemap.xml being up to date.
      - run: npm run validate-pages

      # External links: each request times out after 10s, unreachable and 5xx
      # answers are retried once, and --strict fails on anything still not OK.
      # The step timeout bounds the whole run.
      - run: npm run check-links -- --strict
        timeout-minutes: 5

      # README "Validating examples locally" (now also data/conflicts/*.json).
      - run: npm run validate-schemas

      # .d8a run: block - the path fixer must run cleanly (dry-run, writes nothing).
      - run: npm run fix-paths
